<section class="catalog-page">
  <header class="catalog-header">
    <div>
      <h1>Catálogo</h1>
      <p>101 categorías cuidadosamente curadas, listas para explorar.</p>
    </div>

    <button *ngIf="auth.isAdmin()" type="button" class="btn btn-primary" (click)="toggleAddForm()">
      {{ isAdding ? '✕ Cancelar' : '+ Agregar producto' }}
    </button>
  </header>

  <form class="add-form" *ngIf="isAdding" (ngSubmit)="submitNewProduct()">
    <input type="text" placeholder="Nombre" [(ngModel)]="newProduct.name" name="newName" required />
    <input type="text" placeholder="Ícono (emoji)" [(ngModel)]="newProduct.icon" name="newIcon" maxlength="4" />
    <input type="number" placeholder="Precio" [(ngModel)]="newProduct.price" name="newPrice" min="0" step="0.01" />
    <input type="number" placeholder="Stock" [(ngModel)]="newProduct.stock" name="newStock" min="0" step="1" />
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>

  <div class="toolbar">
    <div class="search-box">
      <input
        type="text"
        placeholder="Buscar categoría..."
        [(ngModel)]="searchTerm"
        name="searchTerm"
      />
    </div>

    <button
      type="button"
      class="favorites-filter"
      [class.active]="showOnlyFavorites"
      (click)="showOnlyFavorites = !showOnlyFavorites"
    >
      {{ showOnlyFavorites ? '★ Solo favoritos' : '☆ Ver favoritos' }}
    </button>
  </div>

  <p class="results-count">{{ filteredProducts.length }} categorías encontradas</p>

  <div class="product-grid">
    <app-product-card
      *ngFor="let product of filteredProducts; let i = index; trackBy: trackById"
      [product]="product"
      [style.animation-delay.ms]="(i % 12) * 40"
    ></app-product-card>
  </div>

  <p class="empty-results" *ngIf="filteredProducts.length === 0">
    No se encontraron categorías con esos filtros.
  </p>
</section>
